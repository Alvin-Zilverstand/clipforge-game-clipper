[package]
name = "clipforge"
version = "0.1.0"
edition = "2021"
description = "Windows-first local game clipping app scaffold with replay buffer and event auto-clipping core."
license = "MIT"

[lib]
name = "clipforge"
path = "src/lib.rs"

[[bin]]
name = "clipforge"
path = "src/main.rs"

[profile.dev]
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
