[package]
name = "clipforge"
version = "0.1.0"
edition = "2021"
description = "Windows-first local game clipping app scaffold with replay buffer and event auto-clipping core."
license = "MIT"

[lib]
name = "clipforge"
path = "src/lib.rs"

[[bin]]
name = "clipforge"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"
wasapi = "0.24.0"
windows-capture = "2.0.1"

[profile.dev]
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
