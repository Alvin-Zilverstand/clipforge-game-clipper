[package]
name = "clipforge-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop shell for ClipForge."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
clipforge = { path = ".." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.9.5", features = [] }
tauri-plugin-global-shortcut = "2"
